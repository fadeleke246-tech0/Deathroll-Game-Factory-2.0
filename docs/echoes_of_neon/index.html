
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echoes of Neon</title>
    <style>
        body {
            margin: 0;
            background-color: #f0f0f0;
        }
        #canvas {
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <canvas id="canvas" width="800" height="600"></canvas>
    <script>
        // Get the canvas element
        var canvas = document.getElementById('canvas');
        var ctx = canvas.getContext('2d');

        // Set the canvas dimensions
        canvas.width = 800;
        canvas.height = 600;

        // Define the game variables
        var player = {
            x: 100,
            y: canvas.height / 2,
            width: 50,
            height: 50,
            speed: 5,
            lives: 3,
            score: 0,
            img: new Image(),
            imgLoaded: false
        };
        player.img.src = 'assets/player.png';

        var enemies = [];
        var powerUps = [];
        var bullets = [];

        var level = 1;
        var interval = 1000;
        var timer = 0;

        // Event listeners
        canvas.addEventListener('mousemove', function(event) {
            var rect = canvas.getBoundingClientRect();
            var x = event.clientX - rect.left;
            var y = event.clientY - rect.top;
            if (x > 0 && x < canvas.width && y > 0 && y < canvas.height) {
                player.x = x;
                player.y = y;
            }
        });
        canvas.addEventListener('touchmove', function(event) {
            var rect = canvas.getBoundingClientRect();
            var x = event.touches[0].clientX - rect.left;
            var y = event.touches[0].clientY - rect.top;
            if (x > 0 && x < canvas.width && y > 0 && y < canvas.height) {
                player.x = x;
                player.y = y;
            }
        });
        document.addEventListener('keydown', function(event) {
            switch (event.key) {
                case 'r':
                    restartGame();
                    break;
            }
        });

        // Load images
        player.img.onload = function() {
            player.imgLoaded = true;
        };

        // Main game loop
        function update() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(player.img, player.x, player.y);
            ctx.font = '24px Arial';
            ctx.fillStyle = 'white';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillText('Score: ' + player.score, 10, 10);
            ctx.fillText('Lives: ' + player.lives, 10, 40);
            ctx.fillText('Level: ' + level, 10, 70);

            // Draw enemies
            for (var i = 0; i < enemies.length; i++) {
                ctx.drawImage(enemies[i].img, enemies[i].x, enemies[i].y);
                enemies[i].x += enemies[i].speed;
                if (enemies[i].x + enemies[i].width > canvas.width || enemies[i].x < 0) {
                    enemies[i].speed *= -1;
                }
                if (checkCollision(player, enemies[i])) {
                    player.lives--;
                    enemies.splice(i, 1);
                    i--;
                }
            }

            // Draw power-ups
            for (var i = 0; i < powerUps.length; i++) {
                ctx.drawImage(powerUps[i].img, powerUps[i].x, powerUps[i].y);
                powerUps[i].x += powerUps[i].speed;
                if (powerUps[i].x + powerUps[i].width > canvas.width || powerUps[i].x < 0) {
                    powerUps.splice(i, 1);
                    i--;
                }
                if (checkCollision(player, powerUps[i])) {
                    player.score += powerUps[i].points;
                    powerUps.splice(i, 1);
                    i--;
                }
            }

            // Draw bullets
            for (var i = 0; i < bullets.length; i++) {
                ctx.drawImage(bullets[i].img, bullets[i].x, bullets[i].y);
                bullets[i].x += bullets[i].speed;
                if (bullets[i].x + bullets[i].width > canvas.width || bullets[i].x < 0) {
                    bullets.splice(i, 1);
                    i--;
                }
                for (var j = 0; j < enemies.length; j++) {
                    if (checkCollision(bullets[i], enemies[j])) {
                        enemies.splice(j, 1);
                        bullets.splice(i, 1);
                        i--;
                        j--;
                    }
                }
            }

            // Draw background
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw level background
            ctx.fillStyle = 'gray';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw level obstacles
            for (var i = 0; i < level; i++) {
                ctx.fillStyle = 'gray';
                ctx.fillRect(i * 100, canvas.height / 2 - 50, 100, 100);
            }

            // Check for game over
            if (player.lives <= 0) {
                player.lives = 3;
                player.score = 0;
                level = 1;
            }

            // Update timer
            timer++;
            if (timer >= interval) {
                level++;
                interval -= 100;
                timer = 0;
            }

            // Draw player
            if (!player.imgLoaded) {
                ctx.fillStyle = 'red';
                ctx.fillRect(player.x, player.y, player.width, player.height);
            }

            requestAnimationFrame(update);
        }

        // Check for collisions
        function checkCollision(obj1, obj2) {
            if (obj1.x + obj1.width > obj2.x && obj1.x < obj2.x + obj2.width && obj1.y + obj1.height > obj2.y && obj1.y < obj2.y + obj2.height) {
                return true;
            }
            return false;
        }

        // Restart game
        function restartGame() {
            player.lives = 3;
            player.score = 0;
            level = 1;
            interval = 1000;
            timer = 0;
            enemies = [];
            powerUps = [];
            bullets = [];
        }

        // Main game loop
        update();

        // Add enemies
        function addEnemy() {
            var enemy = {
                x: Math.random() * (canvas.width - 50),
                y: Math.random() * (canvas.height - 50),
                width: 50,
                height: 50,
                speed: Math.random() * 5,
                img: new Image(),
                imgLoaded: false
            };
            enemy.img.src = 'assets/enemy.png';
            enemies.push(enemy);
        }

        // Add power-ups
        function addPowerUp() {
            var powerUp = {
                x: Math.random() * (canvas.width - 50),
                y: Math.random() * (canvas.height - 50),
                width: 50,
                height: 50,
                speed: Math.random() * 5,
                points: Math.floor(Math.random() * 10),
                img: new Image(),
                imgLoaded: false
            };
            powerUp.img.src = 'assets/bullet.png';
            powerUps.push(powerUp);
        }

        // Add bullets
        function addBullet() {
            var bullet = {
                x: player.x + player.width / 2,
                y: player.y + player.height / 2,
                width: 10,
                height: 10,
                speed: 5,
                img: new Image(),
                imgLoaded: false
            };
            bullet.img.src = 'assets/bullet.png';
            bullets.push(bullet);
        }

        // Add enemies, power-ups and bullets
        setInterval(function() {
            addEnemy();
            addPowerUp();
            addBullet();
        }, 2000);

        // Add key listeners
        document.addEventListener('keydown', function(event) {
            switch (event.key) {
                case ' ':
                    addBullet();
                    break;
            }
        });
    </script>
</body>
</html>
