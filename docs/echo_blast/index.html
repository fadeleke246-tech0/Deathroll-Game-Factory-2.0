
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Blast</title>
    <style>
        #canvas {
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <canvas id="canvas" width="800" height="600"></canvas>
    <script>
        // Get the canvas element
        var canvas = document.getElementById('canvas');
        var ctx = canvas.getContext('2d');

        // Set the canvas dimensions
        canvas.width = 800;
        canvas.height = 600;

        // Define the player properties
        var player = {
            x: canvas.width / 2,
            y: canvas.height - 50,
            width: 50,
            height: 50,
            speed: 5,
            lives: 3,
            score: 0,
            timeMultiplier: 1
        };

        // Define the enemy properties
        var enemies = [];
        var enemySpeed = 2;

        // Define the bullet properties
        var bullets = [];

        // Define the power-up properties
        var powerUps = [];

        // Define the level properties
        var level = 1;
        var levelInterval = 10000; // milliseconds

        // Define the game states
        var gameState = 'playing';

        // Load images
        var playerImage = new Image();
        playerImage.src = 'assets/player.png';
        playerImage.onload = function() {
            player.image = playerImage;
        };

        var enemyImage = new Image();
        enemyImage.src = 'assets/enemy.png';
        enemyImage.onload = function() {
            enemy.image = enemyImage;
        };

        var backgroundImage = new Image();
        backgroundImage.src = 'assets/background.png';
        backgroundImage.onload = function() {
            background.image = backgroundImage;
        };

        var bulletImage = new Image();
        bulletImage.src = 'assets/bullet.png';
        bulletImage.onload = function() {
            bullet.image = bulletImage;
        };

        // Draw the background
        function drawBackground() {
            if (backgroundImage) {
                ctx.drawImage(backgroundImage, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = 'lightblue';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
        }

        // Draw the player
        function drawPlayer() {
            if (player.image) {
                ctx.drawImage(player.image, player.x, player.y, player.width, player.height);
            } else {
                ctx.fillStyle = 'red';
                ctx.fillRect(player.x, player.y, player.width, player.height);
            }
        }

        // Draw the enemies
        function drawEnemies() {
            for (var i = 0; i < enemies.length; i++) {
                var enemy = enemies[i];
                if (enemy.image) {
                    ctx.drawImage(enemy.image, enemy.x, enemy.y, enemy.width, enemy.height);
                } else {
                    ctx.fillStyle = 'blue';
                    ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
                }
            }
        }

        // Draw the bullets
        function drawBullets() {
            for (var i = 0; i < bullets.length; i++) {
                var bullet = bullets[i];
                if (bullet.image) {
                    ctx.drawImage(bullet.image, bullet.x, bullet.y, bullet.width, bullet.height);
                } else {
                    ctx.fillStyle = 'black';
                    ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
                }
            }
        }

        // Draw the power-ups
        function drawPowerUps() {
            for (var i = 0; i < powerUps.length; i++) {
                var powerUp = powerUps[i];
                if (powerUp.image) {
                    ctx.drawImage(powerUp.image, powerUp.x, powerUp.y, powerUp.width, powerUp.height);
                } else {
                    ctx.fillStyle = 'green';
                    ctx.fillRect(powerUp.x, powerUp.y, powerUp.width, powerUp.height);
                }
            }
        }

        // Update the game state
        function update() {
            // Update the player position
            if (player.x < 0) {
                player.x = 0;
            } else if (player.x > canvas.width - player.width) {
                player.x = canvas.width - player.width;
            }

            if (player.y < 0) {
                player.y = 0;
            } else if (player.y > canvas.height - player.height) {
                player.y = canvas.height - player.height;
            }

            // Update the enemies position
            for (var i = 0; i < enemies.length; i++) {
                var enemy = enemies[i];
                enemy.x += enemySpeed * player.timeMultiplier;
                if (enemy.x < 0) {
                    enemies.splice(i, 1);
                }
            }

            // Update the bullets position
            for (var i = 0; i < bullets.length; i++) {
                var bullet = bullets[i];
                bullet.x += bullet.speed * player.timeMultiplier;
                if (bullet.x > canvas.width) {
                    bullets.splice(i, 1);
                }
            }

            // Check for collisions between bullets and enemies
            for (var i = 0; i < bullets.length; i++) {
                var bullet = bullets[i];
                for (var j = 0; j < enemies.length; j++) {
                    var enemy = enemies[j];
                    if (checkCollision(bullet, enemy)) {
                        enemies.splice(j, 1);
                        bullets.splice(i, 1);
                        player.score++;
                    }
                }
            }

            // Check for collisions between player and enemies
            for (var i = 0; i < enemies.length; i++) {
                var enemy = enemies[i];
                if (checkCollision(player, enemy)) {
                    player.lives--;
                    enemies.splice(i, 1);
                }
            }

            // Check for collisions between player and power-ups
            for (var i = 0; i < powerUps.length; i++) {
                var powerUp = powerUps[i];
                if (checkCollision(player, powerUp)) {
                    powerUps.splice(i, 1);
                    if (powerUp.type === 'time') {
                        player.timeMultiplier *= 2;
                    } else if (powerUp.type === 'lives') {
                        player.lives++;
                    } else if (powerUp.type === 'score') {
                        player.score *= 2;
                    }
                }
            }

            // Check if the game is over
            if (player.lives <= 0) {
                gameState = 'gameOver';
            } else if (enemies.length === 0 && bullets.length === 0) {
                level++;
                enemies = [];
                bullets = [];
                powerUps = [];
                player.timeMultiplier = 1;
            }
        }

        // Draw the game
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBackground();
            drawPlayer();
            drawEnemies();
            drawBullets();
            drawPowerUps();
            ctx.font = '24px Arial';
            ctx.fillStyle = 'black';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillText('Score: ' + player.score, 10, 10);
            ctx.fillText('Lives: ' + player.lives, 10, 40);
            ctx.fillText('Level: ' + level, 10, 70);
            if (gameState === 'gameOver') {
                ctx.font = '48px Arial';
                ctx.fillStyle = 'black';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2);
                ctx.font = '24px Arial';
                ctx.fillStyle = 'black';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.fillText('Press space to restart', canvas.width / 2, canvas.height / 2 + 50);
            }
        }

        // Handle user input
        function handleInput(event) {
            if (gameState === 'playing') {
                if (event.type === 'click' || (event.type === 'touchstart' && event.touches.length > 0)) {
                    var touch = event.touches[0] || event;
                    var bullet = {
                        x: player.x + player.width / 2,
                        y: player.y + player.height / 2,
                        speed: 5,
                        image: bulletImage
                    };
                    bullets.push(bullet);
                } else if (event.type === 'keydown' && event.key === ' ') {
                    player.timeMultiplier *= -1;
                } else if (event.type === 'touchmove' && event.touches.length > 0) {
                    var touch = event.touches[0] || event;
                    player.x = touch.clientX - canvas.offsetLeft - canvas.width / 2;
                    player.y = touch.clientY - canvas.offsetTop - canvas.height / 2;
                } else if (event.type === 'mousemove') {
                    player.x = event.clientX - canvas.offsetLeft - canvas.width / 2;
                    player.y = event.clientY - canvas.offsetTop - canvas.height / 2;
                }
            } else if (gameState === 'gameOver' && event.type === 'keydown' && event.key === ' ') {
                gameState = 'playing';
                player.lives = 3;
                player.score = 0;
                level = 1;
                enemies = [];
                bullets = [];
                powerUps = [];
                player.timeMultiplier = 1;
            }
        }
