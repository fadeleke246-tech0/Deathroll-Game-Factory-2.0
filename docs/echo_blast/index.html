
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Echo Blast</title>
  <style>
    /* Add some basic styling to the game */
    body {
      margin: 0;
      overflow: hidden;
    }
    #canvas {
      border: 1px solid #000;
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="800" height="600"></canvas>
  <script>
    // Get the canvas element
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // Set up game variables
    let score = 0;
    let lives = 3;
    let playerSpeed = 5;
    let playerX = canvas.width / 2;
    let playerY = canvas.height / 2;
    let playerVelocityX = 0;
    let playerVelocityY = 0;
    let sonicBlast = [];
    let enemies = [];
    let powerUps = [];
    let bullets = [];

    // Load images (fallback to colored shapes if missing)
    const playerImage = new Image();
    playerImage.src = 'assets/player.png';
    playerImage.onerror = function() {
      playerImage.src = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==';
    };

    const enemyImage = new Image();
    enemyImage.src = 'assets/enemy.png';
    enemyImage.onerror = function() {
      enemyImage.src = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==';
    };

    const backgroundImage = new Image();
    backgroundImage.src = 'assets/background.png';
    backgroundImage.onerror = function() {
      backgroundImage.src = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==';
    };

    const bulletImage = new Image();
    bulletImage.src = 'assets/bullet.png';
    bulletImage.onerror = function() {
      bulletImage.src = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==';
    };

    // Game loop
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(backgroundImage, 0, 0);
      drawPlayer();
      drawEnemies();
      drawPowerUps();
      drawBullets();
      drawSonicBlast();
      drawScore();
      drawLives();
      requestAnimationFrame(draw);
    }

    function drawPlayer() {
      ctx.drawImage(playerImage, playerX, playerY);
    }

    function drawEnemies() {
      for (let i = 0; i < enemies.length; i++) {
        ctx.drawImage(enemyImage, enemies[i].x, enemies[i].y);
      }
    }

    function drawPowerUps() {
      for (let i = 0; i < powerUps.length; i++) {
        ctx.fillStyle = powerUps[i].color;
        ctx.fillRect(powerUps[i].x, powerUps[i].y, 10, 10);
      }
    }

    function drawBullets() {
      for (let i = 0; i < bullets.length; i++) {
        ctx.drawImage(bulletImage, bullets[i].x, bullets[i].y);
      }
    }

    function drawSonicBlast() {
      for (let i = 0; i < sonicBlast.length; i++) {
        ctx.fillStyle = sonicBlast[i].color;
        ctx.beginPath();
        ctx.arc(sonicBlast[i].x, sonicBlast[i].y, 10, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawScore() {
      ctx.font = '24px Arial';
      ctx.fillStyle = '#000';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      ctx.fillText('Score: ' + score, 10, 10);
    }

    function drawLives() {
      ctx.font = '24px Arial';
      ctx.fillStyle = '#000';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      ctx.fillText('Lives: ' + lives, 10, 40);
    }

    // Input handling
    document.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowUp') {
        playerVelocityY = -playerSpeed;
      } else if (e.key === 'ArrowDown') {
        playerVelocityY = playerSpeed;
      } else if (e.key === 'ArrowLeft') {
        playerVelocityX = -playerSpeed;
      } else if (e.key === 'ArrowRight') {
        playerVelocityX = playerSpeed;
      }
    });

    document.addEventListener('keyup', function(e) {
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
        playerVelocityY = 0;
      } else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        playerVelocityX = 0;
      }
    });

    canvas.addEventListener('mousedown', function(e) {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      if (x > playerX && x < playerX + 20 && y > playerY && y < playerY + 20) {
        // Shoot bullet
        bullets.push({ x: playerX + 10, y: playerY + 10 });
      }
    });

    canvas.addEventListener('touchstart', function(e) {
      const rect = canvas.getBoundingClientRect();
      const x = e.touches[0].clientX - rect.left;
      const y = e.touches[0].clientY - rect.top;
      if (x > playerX && x < playerX + 20 && y > playerY && y < playerY + 20) {
        // Shoot bullet
        bullets.push({ x: playerX + 10, y: playerY + 10 });
      }
    });

    // Update game state
    function update() {
      playerX += playerVelocityX;
      playerY += playerVelocityY;

      // Collision detection
      for (let i = 0; i < enemies.length; i++) {
        const enemy = enemies[i];
        if (checkCollision(playerX, playerY, enemy.x, enemy.y, 20, 20, 20, 20)) {
          lives--;
          enemies.splice(i, 1);
          i--;
        }
      }

      for (let i = 0; i < bullets.length; i++) {
        const bullet = bullets[i];
        for (let j = 0; j < enemies.length; j++) {
          const enemy = enemies[j];
          if (checkCollision(bullet.x, bullet.y, enemy.x, enemy.y, 10, 10, 20, 20)) {
            enemies.splice(j, 1);
            bullets.splice(i, 1);
            i--;
            break;
          }
        }
      }

      // Sonic blast
      sonicBlast.push({ x: playerX, y: playerY, color: '#FF0000' });
      sonicBlast.push({ x: playerX, y: playerY, color: '#00FF00' });
      sonicBlast.push({ x: playerX, y: playerY, color: '#0000FF' });

      // Power ups
      if (Math.random() < 0.1) {
        powerUps.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, color: '#FFFF00' });
      }

      // Enemies
      if (Math.random() < 0.1) {
        enemies.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height });
      }

      // Bullets
      if (Math.random() < 0.1) {
        bullets.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height });
      }
    }

    // Check collision
    function checkCollision(x1, y1, x2, y2, w1, h1, w2, h2) {
      if (x1 + w1 > x2 && x1 < x2 + w2 && y1 + h1 > y2 && y1 < y2 + h2) {
        return true;
      }
      return false;
    }

    // Restart game
    function restart() {
      playerX = canvas.width / 2;
      playerY = canvas.height / 2;
      playerVelocityX = 0;
      playerVelocityY = 0;
      sonicBlast = [];
      enemies = [];
      powerUps = [];
      bullets = [];
      lives = 3;
      score = 0;
    }

    // Draw game UI
    function drawUI() {
      ctx.font = '24px Arial';
      ctx.fillStyle = '#000';
      ctx.textAlign
