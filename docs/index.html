<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Deathroll Studio – Game Factory</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <canvas id="starsCanvas"></canvas>
    <div class="content">
        <header class="hero">
            <div class="hero-badge">⚡ DEATHROLL STUDIO</div>
            <h1>Autonomous Game Factory</h1>
            <p>One new playable PWA every week – generated by AI, crafted for you.</p>
            <div class="feature-list">
                <span>🎮 Offline ready</span>
                <span>📱 Installable</span>
                <span>🆓 No ads</span>
                <span>🤖 100% AI‑generated</span>
            </div>
        </header>
        <main>
            <div class="section-header">
                <h2>🎲 Game Vault</h2>
                <div class="pill">Live from factory</div>
            </div>
            <div id="game-grid" class="game-grid">
                <div class="loading-spinner">✨ Loading games...</div>
            </div>
        </main>
        <footer>
            <p>© Deathroll Studio — built by the DEATHROLL FACTORY BOT</p>
            <p><a href="admin.html" class="admin-link">📊 Factory Admin</a></p>
        </footer>
    </div>
    <script src="store.js"></script>
    <script>
        // Stars background
        const canvas = document.getElementById('starsCanvas');
        if(canvas){ const ctx = canvas.getContext('2d'); let stars = [];
        function resize(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; stars = Array(150).fill().map(()=>({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*2,alpha:Math.random()*0.8})); }
        function draw(){ ctx.clearRect(0,0,canvas.width,canvas.height); for(let s of stars){ ctx.globalAlpha = s.alpha; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fillStyle='white'; ctx.fill(); } requestAnimationFrame(draw); }
        window.addEventListener('resize',resize); resize(); draw(); }
    </script>
</body>
</html>
