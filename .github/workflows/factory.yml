name: Deathroll Game Factory
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'   # daily at 06:00 UTC
permissions:
  contents: write
jobs:
  run-phase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install google-genai groq pillow requests
      - name: Get current phase
        id: phase
        run: |
          PHASE=$(python -c "import json; f=open('data/run_state.json'); d=json.load(f); print(d.get('phase',1))" 2>/dev/null || echo "1")
          echo "phase=$PHASE" >> $GITHUB_OUTPUT
      - name: Run Phase ${{ steps.phase.outputs.phase }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: python scripts/phase${{ steps.phase.outputs.phase }}.py
      - name: Commit and push state changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p data docs output
          git add data/ docs/ output/ || true
          git diff --staged --quiet || git commit -m "Auto-update after phase ${{ steps.phase.outputs.phase }}"
          git push
