name: Deathroll Factory Bot

on:
  schedule:
    - cron: '0 6 * * *'   # Runs daily at 6:00 UTC
  workflow_dispatch:       # Manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install requests pillow
          
      - name: Determine current phase
        id: phase
        run: |
          python -c "
import json, os
state_file = 'data/run_state.json'
if not os.path.exists(state_file):
    phase = 1
else:
    with open(state_file) as f:
        phase = json.load(f).get('phase', 1)
print(f'phase={phase}')
" >> $GITHUB_OUTPUT
          
      - name: Run Phase ${{ steps.phase.outputs.phase }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENA_API_KEY }}
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python scripts/phase${{ steps.phase.outputs.phase }}.py
          
      - name: Commit and push changes (art, plans, builds)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ output/ docs/ || true
          git diff --staged --quiet || git commit -m "Auto-update from Phase ${{ steps.phase.outputs.phase }}"
          git push
