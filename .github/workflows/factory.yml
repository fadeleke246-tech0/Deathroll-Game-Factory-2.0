name: Deathroll Factory Bot
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'
jobs:
  build:
    permissions:
      contents: write    # 👈 allows git commit & push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install requests pillow
      - name: Create directories and initial files
        run: |
          mkdir -p data scripts
          touch scripts/__init__.py
          [ -f data/games_queue.json ] || echo '{"games":[{"genre":"local-warfare","status":"pending"}]}' > data/games_queue.json
          [ -f data/run_state.json ] || echo '{"phase":1,"phase_data":{}}' > data/run_state.json
          [ -f data/portfolio.json ] || echo '{"games":[]}' > data/portfolio.json
      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV
      - name: Get current phase
        id: phase
        run: |
          chmod +x scripts/get_phase.sh 2>/dev/null || true
          if [ -f scripts/get_phase.sh ]; then
            scripts/get_phase.sh >> $GITHUB_OUTPUT
          else
            python -c "import json; f=open('data/run_state.json'); d=json.load(f); print(f'phase={d.get(\"phase\",1)}')" >> $GITHUB_OUTPUT
          fi
      - name: Run phase
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENA_API_KEY }}
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python scripts/phase${{ steps.phase.outputs.phase }}.py
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ output/ docs/ scripts/__init__.py || true
          git diff --staged --quiet || git commit -m "Auto-update Phase ${{ steps.phase.outputs.phase }}"
          git push
