name: Deathroll Game Factory
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *'
permissions:
  contents: write
jobs:
  build-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install google-generativeai groq pillow requests openai
      - name: Get phase
        id: phase
        run: |
          PHASE=$(python -c "import json; f=open('data/run_state.json'); d=json.load(f); print(d.get('phase',1))" 2>/dev/null || echo "1")
          echo "phase=$PHASE" >> $GITHUB_OUTPUT
      - name: Phase 1
        if: steps.phase.outputs.phase == '1'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/phase1.py
      - name: Phase 2
        if: steps.phase.outputs.phase == '2'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/phase2.py
      - name: Phase 3
        if: steps.phase.outputs.phase == '3'
        run: python scripts/phase3.py
      - name: Phase 4
        if: steps.phase.outputs.phase == '4'
        run: python scripts/phase4.py
      - name: Phase 5
        if: steps.phase.outputs.phase == '5'
        run: python scripts/phase5.py
      - name: Phase 6
        if: steps.phase.outputs.phase == '6'
        run: python scripts/phase6.py
      - name: Phase 7
        if: steps.phase.outputs.phase == '7'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scripts/phase7.py
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/ output/ || true
          git diff --staged --quiet || git commit -m "Auto-update phase ${{ steps.phase.outputs.phase }}"
          git push
