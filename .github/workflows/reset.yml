name: Reset Factory
on: workflow_dispatch
jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reset phase state
        run: |
          echo '{"phase":1,"phase_data":{}}' > data/run_state.json
          echo '{"games":[{"genre":"offline-fps","status":"pending"}]}' > data/games_queue.json
          echo '{"games":[]}' > data/portfolio.json
          rm -f data/sar_analysis.json data/game_plan.json
          rm -rf output/*
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ output/
          git commit -m "Reset factory state for fresh start with real scripts"
          git push
