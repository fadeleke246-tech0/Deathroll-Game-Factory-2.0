name: Manual Full Factory
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install google-genai groq pillow requests
      - name: Reset state to phase 1
        run: echo '{"phase":1}' > data/run_state.json
      - name: Run all phases
        run: |
          for i in 1 2 3 4 5 6 7; do
            echo "Running phase $i"
            python scripts/phase$i.py
          done
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/ output/ || true
          git diff --staged --quiet || git commit -m "Full factory run"
          git push
